<!--
SKINDERMA v2 — isometric staff lobby (v1 patient app stays at /).
Open this file directly, or visit /v2/ on the deployed site.

Helpers
  iso(gx,gy,gz) / unIso(sx,sy) — tile projection and click inverse
  box(gx,gy,gw,gh,h,top,left,right,stroke,z) — 3-face prism
  chair, workstation, sofa, planter, pendant, wallTV, whiteboard
  glassPartition, autoclave, laserTower, treatmentBed, sanitiser, nameplate
  drawSim, astar, goTo

Add a room
  Push an object into ROOMS (id, gx, gy, gw, gh, z, floor, grid, wall, short, name).
  Set shell:true for outer walls. Add a focus entry in FOCI and a button in the top bar.
  Furnish it inside furnish().

Add a Sim
  Push into STAFF (unique home seat, roleKey matching PLAYBOOKS, quotes, layman, technical).
  Seat them with workstation() or a stool inside furnish() if they use a desk.

Add a prop
  Call box / planter / pendant / sofa / wallTV from furnish(). Keep tall props
  out of the first 40% of a room's back wall so the nameplate stays visible.
-->
<style>

  .pill.on, button.on { background:#3f7d68; color:#fff; border-color:#3f7d68; }
  button.danger { color:var(--rose); border-color:#f4c3cd; }

  .marquee { overflow:hidden; flex:1; }

  .drawer { position:fixed; z-index:6; top:0; right:0; height:100%; width:min(390px,100%); transform:translateX(104%);

  .panel { overflow:auto; font-size:13px; line-height:1.5; color:#334155; flex:1; }
  .panel ul { margin:8px 0 0; padding-left:18px; }

  .term { position:fixed; z-index:7; left:14px; right:14px; bottom:46px; height:210px; display:none; flex-direction:column; padding:10px 12px; }

    ctx.beginPath(); ctx.ellipse(p.x - 3.6 * sc, y - 22.4 * sc, 1.3 * sc, 0.7 * sc, 0, 0, 7); ctx.ellipse(p.x + 3.6 * sc, y - 22.4 * sc, 1.3 * sc, 0.7 * sc, 0, 0, 7); ctx.fill();
    if (s.acc === 'glasses') { ctx.strokeStyle = '#334155'; ctx.strokeRect(p.x - 4.2 * sc, y - 26 * sc, 8.4 * sc, 3.2 * sc); }
    if (s.acc === 'headband') { ctx.fillStyle = '#E85D75'; ctx.fillRect(p.x - 6 * sc, y - 27 * sc, 12 * sc, 1.8 * sc); }
    if (s.acc === 'cap' || s.acc === 'surgical') { ctx.fillStyle = s.acc === 'surgical' ? '#e7f6ef' : '#C4A265'; ctx.beginPath(); ctx.roundRect(p.x - 6.4 * sc, y - 31 * sc, 12.8 * sc, 4 * sc, 2); ctx.fill(); }
    if (s.acc === 'visor') { ctx.fillStyle = '#8EC5FF'; ctx.fillRect(p.x - 6.5 * sc, y - 25.5 * sc, 13 * sc, 2 * sc); }
    if (s.acc === 'headphones' || s.acc === 'headset') { ctx.strokeStyle = '#334155'; ctx.strokeRect(p.x - 7.2 * sc, y - 26 * sc, 2.4 * sc, 4 * sc); ctx.strokeRect(p.x + 4.8 * sc, y - 26 * sc, 2.4 * sc, 4 * sc); }
    if (s.vip) {
      ctx.fillStyle = '#C4A265';
      ctx.beginPath();
      ctx.moveTo(p.x, y - 40 * sc); ctx.lineTo(p.x + 4 * sc, y - 35 * sc); ctx.lineTo(p.x, y - 30 * sc); ctx.lineTo(p.x - 4 * sc, y - 35 * sc); ctx.closePath(); ctx.fill();
    }
    const tag = s.vip ? s.name : s.handle;
    const fill = s.vip ? '#C4A265' : (TAG[s.group] || '#fff');
    ctx.font = '700 ' + Math.max(10, 11 * Math.min(sc, 1.15)) + 'px sans-serif';
    const tw = ctx.measureText(tag).width + 12;
    const tx = p.x - tw / 2;
    const ty = y - (s.vip ? 52 : 46) * sc;
    ctx.fillStyle = 'rgba(60,50,30,.12)';
    round(tx + 1, ty + 2, tw, 16, 8);
    ctx.fillStyle = fill;
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(tx, ty, tw, 16, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = s.vip || s.group === 'Medical' || s.group === 'Facilities' ? '#fff' : '#2c3a32';
    ctx.fillText(tag, tx + 6, ty + 12);
    if (s.say && t < s.sayUntil) {
      ctx.font = '12px sans-serif';
      const bw = Math.min(210, ctx.measureText(s.say).width + 16);
      const bx = p.x - bw / 2, by = ty - 28;
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#e6e0d4';
      ctx.beginPath(); ctx.roundRect(bx, by, bw, 22, 8); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#3f4a3c';
      ctx.fillText(s.say, bx + 8, by + 15);
    }
  }
  function drawNameplate(r) {
    const p = iso(r.gx + 0.7, r.gy + 0.35, (r.z || 0) + (r.label ? 8 : 24));
    const label = (r.z ? '2F ' : '1F ') + r.short;
    ctx.font = '700 11px sans-serif';
    const w = ctx.measureText(label).width + 14;
    ctx.fillStyle = 'rgba(255,253,248,.95)';
    ctx.strokeStyle = '#e6e0d4';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(p.x, p.y, w, 16, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = r.wall || '#3f7d68';
    ctx.fillRect(p.x, p.y, 3, 16);
    ctx.fillStyle = '#4d564c';
    ctx.fillText(label, p.x + 8, p.y + 12);
  }
  function drawFloorLayer(z, alpha) {
    ctx.save(); ctx.globalAlpha = alpha;
    if (z === 0) {
      floorQuad(1, 1, 35, 28, 0, '#f3ece1', '#e7dfd0');
      ctx.strokeStyle = COL.mint; ctx.globalAlpha *= 0.8;
      [[2, 9.4, 33, 0.08],[10.4, 2, 0.08, 26],[22.4, 10, 0.08, 18]].forEach(([x, y, w, h]) => floorQuad(x, y, w, h, 0.2, COL.sage, null));
      const dots = (simT * 0.35) % 1;
      for (let i = 0; i < 5; i++) {
        const o = iso(4 + ((dots + i / 5) % 1) * 28, 9.5, 0.4);
        ctx.fillStyle = COL.rose; ctx.beginPath(); ctx.arc(o.x, o.y, 2.2, 0, 7); ctx.fill();
      }
      ctx.globalAlpha = alpha;
      [[2.2, 7.8],[10.2, 7.8],[22.6, 7.8]].forEach(([x, y]) => box(x, y, 0.5, 0.5, 120, '#f8fafc', '#e2e8f0', '#cbd5e1', '#94a3b8', 0));
    }
    ROOMS.filter((r) => (r.z || 0) === z && r.floor).forEach((r) => floorQuad(r.gx, r.gy, r.gw, r.gh, z + 0.6, '#fffdf8', '#f0e6d4'));
    if (z === 0) {
      ROOMS.filter((r) => r.shell && !r.z).forEach((r) => {
        box(r.gx, r.gy, r.gw, 0.18, 26, '#ffffff', '#f7f4ee', '#e7e1d6', 'rgba(180,170,150,.35)', 0);
        box(r.gx, r.gy, r.gw, 0.18, 1.4, r.wall, r.wall, shade(r.wall, -12), null, 24.6);
        box(r.gx, r.gy, 0.18, r.gh, 26, '#ffffff', '#f4f0e8', r.wall, 'rgba(180,170,150,.28)', 0);
      });
    } else {
      ROOMS.filter((r) => r.shell && r.z === 92).forEach((r) => {
        floorQuad(r.gx, r.gy, r.gw, r.gh, 92, '#fffdf8', '#f0e6d4');
        box(r.gx, r.gy, r.gw, 0.18, 26, '#ffffff', '#f7f4ee', '#e7e1d6', null, 92);
        box(r.gx, r.gy, r.gw, 0.18, 1.4, r.wall, r.wall, shade(r.wall, -12), null, 116.6);
        box(r.gx, r.gy, 0.18, r.gh, 26, '#ffffff', '#f4f0e8', r.wall, null, 92);
      });
    }
    ROOMS.filter((r) => (r.z || 0) === z && (r.shell || r.label)).forEach(drawNameplate);
    const exit = iso(2.4, 19.2, 20);
    if (z === 0) {
      ctx.fillStyle = COL.sage; round(exit.x, exit.y, 18 * view.zoom, 12 * view.zoom, 3);
      ctx.fillStyle = '#fff'; ctx.font = '9px sans-serif'; ctx.fillText('EXIT', exit.x + 2, exit.y + 9 * view.zoom);
    }
    PROPS.forEach((p) => {
      const pz = p.z >= 40 ? 92 : 0;
      if (pz !== z) return;
      drawProp(p, simT);
    });
    actors.filter((s) => !s.dead && ((s.z >= 40 ? 92 : 0) === z)).sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy)).forEach((s) => drawSim(s, simT));
    ctx.restore();
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#f7f3ea'); sky.addColorStop(1, '#fbf8f2');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    drawFloorLayer(0, 1);
    drawFloorLayer(92, showFull ? 1 : 0.18);
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function focusKey(key) {
    const f = FOCI[key] || FOCI.full;
    const zoom = Math.max(0.6, Math.min(2.2, f[3]));
    view.tz = zoom;
    view.tx = W / 2 - (f[0] - f[1]) * TW * zoom;
    view.ty = H / 2 - ((f[0] + f[1]) * TH * zoom - f[2] * zoom) + 10;
    view.glide = true;
    document.querySelectorAll('[data-focus]').forEach((b) => b.classList.toggle('on', b.dataset.focus === key));
  }
  function pick(sx, sy) {
    let best = null, bd = 36;
    actors.forEach((s) => {
      if (s.dead) return;
      const p = iso(s.gx, s.gy, s.z);
      const d = Math.hypot(p.x - sx, p.y - 18 * view.zoom - sy);
      if (d < bd) { bd = d; best = s; }
    });
    return best;
  }
  function highlight(src) {
    return src.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/(^|\n)(#.*)/g, '$1<span class="cm">$2</span>')
      .replace(/\b(def|return|if|for|in)\b/g, '<span class="kw">$1</span>')
      .replace(/(&quot;|")([^"]*)("|&quot;)/g, '<span class="st">"$2"</span>');
  }
  function renderDrawer() {
    const s = selected;
    const drawer = document.getElementById('drawer');
    if (!s) { drawer.classList.remove('open'); return; }
    drawer.classList.add('open');
    document.getElementById('d-name').textContent = s.name;
    document.getElementById('d-role').textContent = s.role + ' · ' + s.group + ' · ' + s.handle;
    document.getElementById('d-state').textContent = s.state + ' · ' + roomAt(s.gx, s.gy, s.z).short;
    const av = document.getElementById('avatar');
    const ax = av.getContext('2d');
    ax.clearRect(0, 0, 144, 144);
    ax.fillStyle = '#f8fafc'; ax.fillRect(0, 0, 144, 144);
    ax.fillStyle = s.uniform; ax.fillRect(48, 78, 48, 40);
    ax.fillStyle = s.skin; ax.beginPath(); ax.arc(72, 62, 22, 0, 7); ax.fill();
    ax.fillStyle = s.hair; ax.beginPath(); ax.arc(72, 52, 24, Math.PI, 0); ax.fill();
    const tabs = ['Layman', 'Technical', 'Code', 'Run', 'Log'];
    document.getElementById('tabs').innerHTML = tabs.map((t) => '<button type="button" data-tab="' + t + '"' + (s.tab === t ? ' class="on"' : '') + '>' + t + '</button>').join('');
    const book = PLAYBOOKS[s.roleKey] || PLAYBOOKS.reception;
    const panel = document.getElementById('panel');
    if (s.tab === 'Technical') panel.innerHTML = '<ul>' + s.tech.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
    else if (s.tab === 'Code') panel.innerHTML = '<pre class="code">' + highlight(book.code) + '</pre>';
    else if (s.tab === 'Run') panel.innerHTML = '<div class="rowbtns"><button class="primary" type="button" id="runbtn">Run task</button><button type="button" id="pantry">Send to pantry</button><button type="button" id="callc">Call to consultation</button><button type="button" id="hand">Hand off to assistant</button></div><div class="runlog" id="runlog">' + (s.runText || '') + '</div>';
    else if (s.tab === 'Log') panel.innerHTML = '<div class="runlog">' + (s.logs.join('\n') || 'No actions yet') + '</div>';
    else panel.innerHTML = '<p>' + s.lay + '</p>';
    document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => { s.tab = b.dataset.tab; renderDrawer(); });
    const run = document.getElementById('runbtn');
    if (run) run.onclick = () => startRun(s);
    const pantry = document.getElementById('pantry');
    if (pantry) pantry.onclick = () => { s.say = 'Coffee at P-110~'; s.sayUntil = simT + 3; goTo(s, 6.2, 15.2, 0, 'BREAK'); s.breakUntil = simT + 10; log(s, 'Sent to pantry'); };
    const callc = document.getElementById('callc');
    if (callc) callc.onclick = () => { goTo(s, 27.2, 7.2, 0, 'BREAK'); s.breakUntil = simT + 10; s.say = 'Called to consultation'; s.sayUntil = simT + 3; log(s, 'Called to C-201'); };
    const hand = document.getElementById('hand');
    if (hand) hand.onclick = () => { openTerm(); document.getElementById('termin').value = 'run ' + s.handle; };
  }
  function startRun(s) {
    if (s.busy) return;
    s.busy = true; s.runText = ''; s.tab = 'Run'; renderDrawer();
    log(s, 'Task started');
    const done = (last) => {
      s.busy = false;
      s.say = last; s.sayUntil = simT + 4;
      log(s, last);
      renderDrawer();
    };
    const push = (line) => {
      s.runText += line + '\n';
      const el = document.getElementById('runlog');
      if (el && selected === s) el.textContent = s.runText;
    };
    if (backend) {
      fetch('/api/run', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ handle: s.handle }) })
        .then((res) => {
          const reader = res.body.getReader();
          const dec = new TextDecoder();
          let buf = '';
          const pump = () => reader.read().then(({ done: end, value }) => {
            if (end) { done(s.runText.trim().split('\n').pop() || 'Task complete'); return; }
            buf += dec.decode(value, { stream: true });
            const parts = buf.split('\n\n'); buf = parts.pop();
            parts.forEach((p) => push(p.replace(/^data:\s*/, '')));
            return pump();
          });
          return pump();
        }).catch(() => simulate(s, push, done));
      return;
    }
    simulate(s, push, done);
  }
  function simulate(s, push, done) {
    const steps = (PLAYBOOKS[s.roleKey] || PLAYBOOKS.reception).steps;
    let i = 0;
    const tick = () => {
      if (i >= steps.length) { done((PLAYBOOKS[s.roleKey] || PLAYBOOKS.reception).result); return; }
      push(steps[i++]);
      setTimeout(tick, 300 + Math.random() * 500);
    };
    tick();
  }
  function openTerm() { document.getElementById('term').classList.add('open'); }
  function printTerm(line) {
    termLines.push(line);
    const out = document.getElementById('termout');
    out.textContent = termLines.join('\n');
    out.scrollTop = out.scrollHeight;
  }
  function command(raw) {
    const line = raw.trim();
    if (!line) return;
    printTerm('> ' + line);
    if (line === 'help') {
      printTerm('help\nrun @handle\nfocus <room|full|yeyen|consult|treat|f2>\ncodepink\nspeed <0|1|2|5>\npause\nresume\nshow2f\nsay @handle "message"\nlist');
      printTerm('rooms: ' + Object.keys(FOCI).join(', '));
      return;
    }
    if (line === 'list') { printTerm(actors.filter((a) => !a.guest).map((a) => a.handle + ' · ' + a.state).join('\n')); return; }
    if (line === 'pause') { paused = true; printTerm('paused'); syncSpeed(); return; }
    if (line === 'resume') { paused = false; speed = speed || 1; printTerm('resumed'); syncSpeed(); return; }
    if (line === 'show2f') { showFull = !showFull; printTerm(showFull ? '2F shown' : '2F cut away'); syncSpeed(); return; }
    if (line === 'codepink') { triggerPink(); printTerm('Code Pink'); return; }
    let m = line.match(/^speed\s+(\d+(?:\.\d+)?)/);
    if (m) {
      const n = Number(m[1]);
      if (n === 0) { paused = true; speed = 0; } else { paused = false; speed = n; }
      printTerm('speed ' + n); syncSpeed(); return;
    }
    m = line.match(/^focus\s+(\S+)/i);
    if (m) {
      const key = m[1];
      if (!FOCI[key] && key !== 'T-300') { printTerm('unknown focus'); return; }
      focusKey(FOCI[key] ? key : 'treat'); printTerm('focused ' + key); return;
    }
    m = line.match(/^run\s+(@?\w+)/);
    if (m) {
      const handle = m[1].startsWith('@') ? m[1] : '@' + m[1];
      const s = actors.find((a) => a.handle === handle);
      if (!s) { printTerm('unknown sim'); return; }
      selected = s; s.tab = 'Run'; renderDrawer(); startRun(s); printTerm('running ' + handle); return;
    }
    m = line.match(/^say\s+(@?\w+)\s+"([^"]*)"/);
    if (m) {
      const handle = m[1].startsWith('@') ? m[1] : '@' + m[1];
      const s = actors.find((a) => a.handle === handle);
      if (!s) { printTerm('unknown sim'); return; }
      s.say = m[2]; s.sayUntil = simT + 4; log(s, 'Say: ' + m[2]); printTerm('said'); return;
    }
    printTerm('unknown command — try help');
  }
  function triggerPink() {
    pinkUntil = simT + 12;
    actors.forEach((s) => {
      if (s.guest || s.dead) return;
      s.rush = true; s.busy = false;
      s.say = 'Code Pink — to consultations'; s.sayUntil = simT + 3.5;
      log(s, 'Code Pink');
      goTo(s, 26 + (s.phase % 3), 6.5 + (s.phase % 2), 0, 'PINK');
    });
  }
  function syncSpeed() {
    document.querySelectorAll('[data-speed]').forEach((b) => {
      const v = b.dataset.speed;
      const on = v === 'pause' ? paused : !paused && String(speed) === v;
      b.classList.toggle('on', on);
    });
    const cut = document.getElementById('cut2');
    if (cut) { cut.textContent = showFull ? 'Cut away 2F' : 'Show 2F'; cut.classList.toggle('on', showFull); }
    const pink = document.getElementById('pink');
    if (pink) pink.classList.toggle('on', simT < pinkUntil);
  }
  function buildTools() {
    const tools = document.getElementById('tools');
    const buttons = [
      ['full','Full Clinic'], ['yeyen','dr. Yeyen'], ['f2','2F Boardroom & Ops'], ['R-101','1F Reception'],
      ['consult','1F Consultations'], ['P-110','1F Pantry'], ['treat','1F Treatment Suites'],
      ['S-120','1F Sterilisation'], ['L-105','1F Patient Lounge'], ['D-108','1F Lockers']
    ];
    tools.innerHTML = buttons.map(([k, label]) => '<button type="button" data-focus="' + k + '">' + label + '</button>').join('')
      + '<button type="button" id="cut2">Cut away 2F</button>'
      + '<button type="button" data-speed="pause">Pause</button><button type="button" data-speed="1">1x</button><button type="button" data-speed="2">2x</button><button type="button" data-speed="5">5x</button>'
      + '<button type="button" class="danger" id="pink">Trigger Code Pink</button>'
      + '<button type="button" id="termbtn">Terminal</button>'
      + '<span class="status" id="status">Static preview — backend offline</span>';
    tools.querySelectorAll('[data-focus]').forEach((b) => b.onclick = () => focusKey(b.dataset.focus));
    document.getElementById('cut2').onclick = () => { showFull = !showFull; syncSpeed(); };
    tools.querySelectorAll('[data-speed]').forEach((b) => b.onclick = () => {
      if (b.dataset.speed === 'pause') { paused = !paused; if (!paused && !speed) speed = 1; }
      else { paused = false; speed = Number(b.dataset.speed); }
      syncSpeed();
    });
    document.getElementById('pink').onclick = triggerPink;
    document.getElementById('termbtn').onclick = () => document.getElementById('term').classList.toggle('open');
    syncSpeed();
  }
  function bootLogo() {
    const c = document.getElementById('logo');
    const g = c.getContext('2d');
    g.clearRect(0, 0, 72, 72);
    g.fillStyle = COL.sage; g.beginPath(); g.arc(36, 36, 30, 0, 7); g.fill();
    g.save(); g.translate(36, 36); g.scale(1.7, 1.7); logoMark(0, 0, 10); g.restore();
  }

  furnish();
  STAFF.forEach((s) => { const a = makeActor(s); a.tab = 'Layman'; actors.push(a); });
  buildTools();
  bootLogo();
  resize();
  focusKey('full');
  printTerm('SKINDERMA lobby ready. Type help.');

  canvas.addEventListener('pointerdown', (e) => {
    drag = { x: e.clientX, y: e.clientY, ox: view.x, oy: view.y, moved: false, id: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    hover = pick(e.clientX - rect.left, e.clientY - rect.top);
    canvas.style.cursor = hover ? 'pointer' : 'grab';
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    view.glide = false;
    view.x = drag.ox + dx; view.y = drag.oy + dy;
    view.tx = view.x; view.ty = view.y;
  });
  canvas.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) {
      const rect = canvas.getBoundingClientRect();
      const hit = pick(e.clientX - rect.left, e.clientY - rect.top);
      selected = hit;
      if (hit && !hit.tab) hit.tab = 'Layman';
      renderDrawer();
    }
    drag = null;
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const next = Math.max(0.6, Math.min(2.2, view.zoom * (e.deltaY < 0 ? 1.08 : 0.92)));
    view.zoom = next; view.tz = next; view.glide = false;
  }, { passive: false });
  window.addEventListener('resize', () => { resize(); if (view.glide) focusKey(document.querySelector('[data-focus].on')?.dataset.focus || 'full'); });
  document.getElementById('d-close').onclick = () => { selected = null; renderDrawer(); };
  document.getElementById('termform').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('termin');
    command(input.value); input.value = '';
  };
  fetch('/api/health').then((r) => r.ok ? r.json() : Promise.reject()).then((j) => {
    if (j && j.ok) {
      backend = true;
      const el = document.getElementById('status');
      el.textContent = 'Live backend · ready';
      el.classList.add('live');
    }
  }).catch(() => {});

  let last = performance.now();
  let guestAt = 6;
  let tickAt = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000) * (paused ? 0 : speed);
    last = now;
    simT += dt;
    if (view.glide) {
      view.x += (view.tx - view.x) * 0.08;
      view.y += (view.ty - view.y) * 0.08;
      view.zoom += (view.tz - view.zoom) * 0.08;
    }
    actors.forEach((a) => updateActor(a, dt));
    for (let i = actors.length - 1; i >= 0; i--) if (actors[i].dead) actors.splice(i, 1);
    if (simT > guestAt) { spawnGuest(); guestAt = simT + 40; }
    if (simT > pinkUntil) {
      const pink = document.getElementById('pink');
      if (pink && pink.classList.contains('on')) pink.classList.remove('on');
    }
    if (now > tickAt) {
      tickAt = now + 1000;
      const d = new Date();
      document.getElementById('clockline').textContent = 'SKINDERMA · 2 floors · ' + d.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
      const text = actors.filter((a) => !a.guest && !a.dead).map((a) => a.handle + ' · ' + roomAt(a.gx, a.gy, a.z).short).join('    ');
      document.getElementById('tick').textContent = text + '    ' + text;
      if (selected) document.getElementById('d-state').textContent = selected.state + ' · ' + roomAt(selected.gx, selected.gy, selected.z).short;
    }
    frame();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
